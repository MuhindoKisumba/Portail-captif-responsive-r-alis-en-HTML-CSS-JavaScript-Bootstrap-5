<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portail Captif Wi-Fi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:linear-gradient(135deg,#0d6efd,#6610f2);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

.background{

position:absolute;

width:100%;

height:100%;

background:url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1800&q=80");

background-size:cover;

background-position:center;

filter:blur(8px);

transform:scale(1.1);

z-index:-2;

}

.overlay{

position:absolute;

width:100%;

height:100%;

background:rgba(0,0,0,.55);

z-index:-1;

}

.login-card{

background:white;

border-radius:20px;

padding:35px;

width:430px;

box-shadow:0 15px 35px rgba(0,0,0,.4);

animation:fadeIn .8s;

}

.logo{

width:90px;

height:90px;

border-radius:50%;

display:block;

margin:auto;

margin-bottom:20px;

}

.title{

text-align:center;

font-weight:bold;

color:#0d6efd;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#666;

margin-bottom:30px;

}

.btn-login{

width:100%;

padding:12px;

font-size:18px;

font-weight:bold;

}

.footer{

margin-top:20px;

text-align:center;

font-size:13px;

color:#777;

}

.signal{

display:flex;

justify-content:center;

margin-bottom:20px;

}

.bar{

width:8px;

margin:3px;

background:#198754;

border-radius:5px;

animation:signal 1s infinite;

}

.bar:nth-child(1){height:15px;}
.bar:nth-child(2){height:25px;animation-delay:.2s;}
.bar:nth-child(3){height:35px;animation-delay:.4s;}
.bar:nth-child(4){height:45px;animation-delay:.6s;}

@keyframes signal{

50%{

opacity:.2;

}

}

@keyframes fadeIn{

from{

transform:translateY(-30px);

opacity:0;

}

to{

transform:translateY(0);

opacity:1;

}

}

.speed{

text-align:center;

margin-top:15px;

font-weight:bold;

color:#198754;

}

#loader{

display:none;

}

</style>

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>

<div class="login-card">

<img src="https://cdn-icons-png.flaticon.com/512/483/483947.png" class="logo">

<h3 class="title">
PORTAIL CAPTIF
</h3>

<p class="subtitle">
Connexion au réseau Internet
</p>

<div class="signal">

<div class="bar"></div>

<div class="bar"></div>

<div class="bar"></div>

<div class="bar"></div>

</div>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">
Nom d'utilisateur
</label>

<input
type="text"
class="form-control"
placeholder="Entrer votre identifiant"
id="username"
required>

</div>

<div class="mb-3">

<label class="form-label">
Mot de passe
</label>

<input
type="password"
class="form-control"
placeholder="Entrer votre mot de passe"
id="password"
required>

</div>

<div class="form-check mb-3">

<input class="form-check-input" type="checkbox" id="remember">

<label class="form-check-label">

Se souvenir de moi

</label>

</div>

<button class="btn btn-primary btn-login">

Se connecter

</button>

</form>

<div class="text-center mt-4">

<div id="loader" class="spinner-border text-primary"></div>

</div>

<div class="speed">

Etat : <span id="status">En attente...</span>

</div>

<hr>

<div class="row text-center">

<div class="col">

<strong>Wi-Fi</strong>

<br>

Disponible

</div>

<div class="col">

<strong>Clients</strong>

<br>

199

</div>

<div class="col">

<strong>Débit</strong>

<br>

300 Mbps

</div>

</div>

<div class="footer">

© 2026 Tous droits réservés

<br>

Powered by Bootstrap 5

</div>

</div>

<script>

const form=document.getElementById("loginForm");

const loader=document.getElementById("loader");

const status=document.getElementById("status");

form.addEventListener("submit",function(e){

e.preventDefault();

loader.style.display="inline-block";

status.innerHTML="Authentification...";

setTimeout(function(){

loader.style.display="none";

status.innerHTML="Connexion réussie";

alert("Bienvenue sur le réseau !");

// Exemple de redirection
// window.location.href="https://google.com";

// Exemple d'appel API
/*
fetch("/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:document.getElementById("username").value,
password:document.getElementById("password").value
})
});
*/

},2500);

});

</script>

</body>

</html>
